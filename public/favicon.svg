<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="32" fill="url(#gradient)"/>
  
  <!-- Justice scales icon -->
  <g transform="translate(16, 18)">
    <!-- Center pole -->
    <rect x="14" y="0" width="4" height="28" fill="white" rx="2"/>
    
    <!-- Horizontal beam -->
    <rect x="4" y="6" width="24" height="3" fill="white" rx="1.5"/>
    
    <!-- Left scale -->
    <path d="M 8 10 L 6 16 L 10 16 Z" fill="white"/>
    <line x1="8" y1="10" x2="8" y2="16" stroke="white" stroke-width="1.5"/>
    
    <!-- Right scale -->
    <path d="M 24 10 L 22 16 L 26 16 Z" fill="white"/>
    <line x1="24" y1="10" x2="24" y2="16" stroke="white" stroke-width="1.5"/>
    
    <!-- Base -->
    <ellipse cx="16" cy="28" rx="8" ry="2" fill="white"/>
  </g>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
